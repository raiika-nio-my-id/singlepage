# Canonical public upstreams. Included from default.conf inside `server`.
# scripts/deploy.sh may replace .deploy/nginx-upstream.conf with a regular
# file during a Path B switch, then restore the symlink to this file.
# Do not put secrets here. Only `set` directives are valid in this include.
set $php_upstream singlepage-app:9000;
set $reverb_upstream singlepage-reverb:8080;
