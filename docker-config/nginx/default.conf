server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    client_max_body_size 50M;

    # Docker's DNS. A variable keeps the Reverb upstream resolvable after restarts.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Laravel Reverb, one websocket for every game subdomain. Forge-style proxy:
    # browsers use /app, the app publishes events to /apps.
    location /app {
        set $game_ws singlepage-reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://$game_ws;
    }

    location /apps {
        set $game_api singlepage-reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://$game_api;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Unique container name — do not use a shared service name like "app".
        fastcgi_pass singlepage-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        # Fall back when global-proxy omits forwarded headers (empty values break Laravel URL generation)
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port if_not_empty;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
