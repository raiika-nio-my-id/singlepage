# Standby PHP slot used only by scripts/deploy.sh during Path B.
# A normal `docker compose up` does not load this file.
# The script runs it as project `singlepage-green` and removes it after
# traffic is back on container singlepage-app.
#
# Required environment (exported by deploy.sh):
#   GREEN_APP_MOUNT, APP_DIR, DEPLOY_GREEN_PORT, HEALTH_NGINX_CONF
# global-mysql is not defined here and must not be added.

services:
  singlepage_green:
    image: ${SINGLEPAGE_IMAGE:-singlepage:incoming}
    container_name: singlepage-app-green
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ${GREEN_APP_MOUNT:?}:/var/www
      - ${APP_DIR:?}/.env:/var/www/.env:ro
      - ${APP_DIR:?}/storage:/var/www/storage
      - ${GREEN_APP_MOUNT:?}/docker-config/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-50M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-50M}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
      PHP_MAX_INPUT_TIME: ${PHP_MAX_INPUT_TIME:-300}
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-On}
      # Publish to the live Reverb (compose DNS alias), not a second process.
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-services

  nginx_health:
    image: nginx:alpine
    container_name: singlepage-nginx-health
    restart: "no"
    depends_on:
      - singlepage_green
    ports:
      - "127.0.0.1:${DEPLOY_GREEN_PORT:?}:80"
    volumes:
      - ${GREEN_APP_MOUNT:?}:/var/www:ro
      - ${HEALTH_NGINX_CONF:?}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shared-services

networks:
  shared-services:
    external: true
