name: Deploy to Production

# ── Triggers ──────────────────────────────────────────────────────────────────
# 1. Automatic: every push to main (skips docs-only changes).
# 2. Manual:    "Run workflow" button in the GitHub Actions UI.
on:
  push:
    branches: [main]
    # Empty commits do not run this workflow: with paths-ignore GitHub
    # treats a no-file-change push as unmatched and skips the job.
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (defaults to main)'
        required: false
        default: 'main'
        type: string
      deployer_name:
        description: 'Name of the person who triggered the deploy'
        required: false
        default: ''
        type: string
      maintenance:
        description: 'artisan down for a breaking schema change'
        required: false
        default: false
        type: boolean
      force_recreate:
        description: 'Force a blue-green container replace'
        required: false
        default: false
        type: boolean
      restart_reverb:
        description: 'Recreate Reverb after the deploy (WebSocket clients reconnect)'
        required: false
        default: false
        type: boolean

# ── Safety: only one deploy at a time ─────────────────────────────────────────
# A second run queues (cancel-in-progress: false) rather than clobbering the
# first. Change to true if you'd prefer to cancel the running deploy instead.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # On push: "Deploy main (by octocat)"
    # On workflow_dispatch with deployer_name: "Deploy main (by Alice)"
    # On workflow_dispatch without deployer_name: "Deploy feature/x (by octocat)"
    name: >-
      Deploy ${{ inputs.ref || github.ref_name }}
      (by ${{ inputs.deployer_name || github.actor }})
    runs-on: ubuntu-latest

    # Optional: pin an environment for approval gates / environment secrets.
    # environment: production

    steps:
      - name: Validate ref
        run: |
          # On push triggers inputs.ref is empty; fall back to the pushed branch name.
          REF="${{ inputs.ref || github.ref_name }}"
          if [[ ! "$REF" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
            echo "::error::Invalid ref: '$REF'. Only alphanumeric characters, dots, slashes, underscores, and dashes are allowed."
            exit 1
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          # inputs.ref is empty on push triggers; github.ref_name is the pushed branch.
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # Push events have no inputs; both expressions are 0 unless the
          # workflow_dispatch checkbox is set.
          DEPLOY_MAINTENANCE: ${{ inputs.maintenance && '1' || '0' }}
          DEPLOY_FORCE_RECREATE: ${{ inputs.force_recreate && '1' || '0' }}
          DEPLOY_RESTART_REVERB: ${{ inputs.restart_reverb && '1' || '0' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # DEPLOY_PORT is optional; leave unset to use the default (22).
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # SHA256 host-key fingerprint of the server.
          # Obtain on the server with:
          #   ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub | awk '{print $2}'
          # Output looks like: SHA256:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_REF,DEPLOY_PATH,DEPLOY_MAINTENANCE,DEPLOY_FORCE_RECREATE,DEPLOY_RESTART_REVERB
          # Bootstrap: fetch first so scripts/deploy.sh is available even on the
          # first run (the server checkout may not yet contain the script).
          # Piping from origin/$DEPLOY_REF guarantees the server always runs the
          # same version of deploy.sh that is in the target ref. That script
          # chooses Path A (bind-mounted code) or Path B (blue-green).
          script: |
            set -euo pipefail
            APP_DIR="${DEPLOY_PATH:-/var/www/singlepage}"
            cd "$APP_DIR"
            echo "==> Fetching latest refs from origin..."
            git fetch --prune --tags origin
            echo "==> Running scripts/deploy.sh @ origin/${DEPLOY_REF}"
            args=( "${DEPLOY_REF}" )
            if [ "${DEPLOY_MAINTENANCE:-0}" = "1" ]; then
              args+=( --maintenance )
            fi
            if [ "${DEPLOY_FORCE_RECREATE:-0}" = "1" ]; then
              args+=( --force-recreate )
            fi
            if [ "${DEPLOY_RESTART_REVERB:-0}" = "1" ]; then
              args+=( --restart-reverb )
            fi
            git show "origin/${DEPLOY_REF}:scripts/deploy.sh" | bash -s -- "${args[@]}"
