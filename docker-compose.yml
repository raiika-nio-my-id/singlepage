# Relies on ~/project/infrastructure (mysql-db on shared-services,
# global-proxy / Nginx Proxy Manager on host network → 127.0.0.1:${APP_PORT}).
# Create the network once: docker network create shared-services
services:
  singlepage:
    build: .
    container_name: singlepage-app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker-config/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-50M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-50M}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME:-300}
      - PHP_DISPLAY_ERRORS=${PHP_DISPLAY_ERRORS:-On}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-services

  scheduler:
    build: .
    container_name: singlepage-scheduler
    restart: unless-stopped
    user: root
    entrypoint: ["/usr/local/bin/scheduler-entrypoint.sh"]
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker-config/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-50M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-50M}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME:-300}
      - PHP_DISPLAY_ERRORS=${PHP_DISPLAY_ERRORS:-On}
    depends_on:
      - singlepage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-services

  nginx:
    image: nginx:alpine
    container_name: singlepage-nginx
    restart: unless-stopped
    ports:
      # 8080 is used by invoiceku-nginx / global-proxy → invoiceku.test
      - "${APP_PORT:-8081}:80"
    volumes:
      - .:/var/www
      - ./docker-config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - singlepage
    networks:
      - shared-services

networks:
  shared-services:
    external: true
